<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="One introduction: what Kai sees, what Eleni sees, their mission and three questions">
  <title>One introduction, as each person sees it</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FD3FF"/>
      <stop offset=".5" stop-color="#B9A7FF"/>
      <stop offset="1" stop-color="#FFB8CF"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".15" cy=".2" r=".6">
      <stop offset="0" stop-color="#7CF2C4" stop-opacity=".10"/>
      <stop offset="1" stop-color="#7CF2C4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".85" cy=".2" r=".6">
      <stop offset="0" stop-color="#FFB86B" stop-opacity=".10"/>
      <stop offset="1" stop-color="#FFB86B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx=".5" cy="1" r=".6">
      <stop offset="0" stop-color="#6E6BF2" stop-opacity=".20"/>
      <stop offset="1" stop-color="#6E6BF2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx=".35" cy=".35" r=".75">
      <stop offset="0" stop-color="#F4F0FF"/>
      <stop offset=".35" stop-color="#8FD3FF"/>
      <stop offset=".7" stop-color="#B9A7FF"/>
      <stop offset="1" stop-color="#FFB8CF"/>
    </radialGradient>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .serif{font-family:ui-serif,"New York","Iowan Old Style",Georgia,serif}
      .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
      .eyebrow{font-size:12px;font-weight:600;letter-spacing:3px;fill:#B9A7FF}
      .note{font-size:13px;fill:#7D7A9E}
      .card{fill:#10101A;stroke:#262640}
      .who{font-size:13px;font-weight:600;fill:#8E8BB8;letter-spacing:.4px}
      .name{font-size:17px;font-weight:600;fill:#F4F0FF}
      .tease{font-size:20px;fill:#EDEBFF}
      .ini{font-size:17px;font-weight:600;fill:#14141F}
      .lab{font-size:11px;font-weight:700;letter-spacing:2.4px}
      .mission{font-size:21px;fill:#F4F0FF}
      .q{font-size:15px;fill:#C9C5E6}
      .badge{font-size:12px;fill:#D9D3FF}
      .orb{transform-box:fill-box;transform-origin:center;animation:breathe 3s ease-in-out infinite}
      @keyframes breathe{0%,100%{transform:scale(.92)}50%{transform:scale(1.06)}}
      .wire{stroke:#B9A7FF;stroke-width:2;stroke-dasharray:3 6;stroke-linecap:round;animation:wire 1.4s linear infinite}
      @keyframes wire{to{stroke-dashoffset:-18}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
  </defs>

  <rect width="1000" height="600" rx="24" fill="#07070D"/>
  <rect width="1000" height="600" rx="24" fill="url(#glowA)"/>
  <rect width="1000" height="600" rx="24" fill="url(#glowB)"/>
  <rect width="1000" height="600" rx="24" fill="url(#glowC)"/>
  <rect x=".5" y=".5" width="999" height="599" rx="23.5" fill="none" stroke="#1E1E30"/>

  <text x="50" y="50" class="sans eyebrow">ONE INTRODUCTION, AS EACH PERSON SEES IT</text>
  <text x="950" y="50" text-anchor="end" class="sans note">written by Gemini in a test run</text>


  <!-- what Kai sees -->
  <g>
    <rect x="50" y="80" width="420" height="200" rx="18" class="card"/>
    <circle cx="90" cy="120" r="20" fill="#7CF2C4"/>
    <text x="90" y="126" text-anchor="middle" class="serif ini">K</text>
    <text x="122" y="116" class="sans who">EMMA TO</text>
    <text x="122" y="136" class="sans name">Kai</text>
    <circle cx="436" cy="120" r="12" fill="url(#orb)" class="orb"/>
    <text class="serif tease"><tspan x="74" y="184">Find Eleni and ask her how she escaped</tspan><tspan x="74" y="212">fintech. She might just skin your menu</tspan><tspan x="74" y="240">reader before morning.</tspan></text>
  </g>

  <!-- what Eleni sees -->
  <g>
    <rect x="530" y="80" width="420" height="200" rx="18" class="card"/>
    <circle cx="570" cy="120" r="20" fill="#FFB86B"/>
    <text x="570" y="126" text-anchor="middle" class="serif ini">E</text>
    <text x="602" y="116" class="sans who">EMMA TO</text>
    <text x="602" y="136" class="sans name">Eleni</text>
    <circle cx="916" cy="120" r="12" fill="url(#orb)" class="orb"/>
    <text class="serif tease"><tspan x="554" y="184">Go track down Kai and ask about his hot</tspan><tspan x="554" y="212">sauce stash; he used to wear a bank</tspan><tspan x="554" y="240">suit too.</tspan></text>
  </g>

  <!-- their mission -->
  <g>
    <rect x="50" y="300" width="900" height="114" rx="18" fill="#141228" stroke="#3A3466"/>
    <text x="74" y="336" class="sans lab" fill="#FFB8CF">THE MISSION · TWO MINUTES, TOGETHER</text>
    <rect x="818" y="320" width="108" height="24" rx="12" fill="#1F1C3A" stroke="#3A3466"/>
    <text x="872" y="336" text-anchor="middle" class="sans badge">recipe: twin</text>
    <text class="serif mission"><tspan x="74" y="372">Translate a confusing foreign menu together and sketch a three-tap</tspan><tspan x="74" y="398">emergency interface on a napkin.</tspan></text>
  </g>

  <!-- three questions, light to deep -->
  <g>
    <rect x="50" y="436" width="290" height="140" rx="18" class="card"/>
    <rect x="74" y="460" width="18" height="4" rx="2" fill="#8FD3FF"/>
    <text x="100" y="465" class="sans lab" fill="#8FD3FF">LIGHT</text>
    <text class="sans q"><tspan x="74" y="500">What's the weirdest thing you've</tspan><tspan x="74" y="522">ever tried to translate while</tspan><tspan x="74" y="544">travelling?</tspan></text>
  </g>
  <g>
    <rect x="355" y="436" width="290" height="140" rx="18" class="card"/>
    <rect x="379" y="460" width="18" height="4" rx="2" fill="#B9A7FF"/>
    <rect x="379" y="454" width="18" height="4" rx="2" fill="#B9A7FF" opacity=".55"/>
    <text x="405" y="465" class="sans lab" fill="#B9A7FF">REAL</text>
    <text class="sans q"><tspan x="379" y="500">At what exact point did you</tspan><tspan x="379" y="522">realize banking was eating</tspan><tspan x="379" y="544">your soul?</tspan></text>
  </g>
  <g>
    <rect x="660" y="436" width="290" height="140" rx="18" class="card"/>
    <rect x="684" y="460" width="18" height="4" rx="2" fill="#FFB8CF"/>
    <rect x="684" y="454" width="18" height="4" rx="2" fill="#FFB8CF" opacity=".55"/>
    <rect x="684" y="448" width="18" height="4" rx="2" fill="#FFB8CF" opacity=".3"/>
    <text x="710" y="465" class="sans lab" fill="#FFB8CF">DEEP</text>
    <text class="sans q"><tspan x="684" y="500">Are we building language tools to</tspan><tspan x="684" y="522">connect with people, or to avoid</tspan><tspan x="684" y="544">asking for help?</tspan></text>
  </g>
  <!-- the link between them -->
  <g>
    <line x1="480" y1="180" x2="520" y2="180" class="wire"/>
    <circle cx="480" cy="180" r="4" fill="#7CF2C4"/><circle cx="520" cy="180" r="4" fill="#FFB86B"/>
  </g>
</svg>
