<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="How a match happens, in six steps">
  <title>How a match happens</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FD3FF"/>
      <stop offset=".5" stop-color="#B9A7FF"/>
      <stop offset="1" stop-color="#FFB8CF"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8FD3FF"/>
      <stop offset=".55" stop-color="#6E6BF2"/>
      <stop offset="1" stop-color="#FFB8CF"/>
    </linearGradient>
    <radialGradient id="glowA" cx=".22" cy=".1" r=".6">
      <stop offset="0" stop-color="#6E6BF2" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6E6BF2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx=".85" cy=".95" r=".55">
      <stop offset="0" stop-color="#FFB8CF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FFB8CF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="comet">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".35" stop-color="#B9A7FF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#6E6BF2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .serif{font-family:ui-serif,"New York","Iowan Old Style",Georgia,serif}
      .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
      .eyebrow{font-size:12px;font-weight:600;letter-spacing:3px;fill:#B9A7FF}
      .note{font-size:13px;fill:#7D7A9E}
      .card{fill:#10101A;stroke:#262640;stroke-width:1}
      .num{font-size:13px;fill:#8E8BB8;letter-spacing:1px}
      .ttl{font-size:25px;fill:#F4F0FF}
      .txt{font-size:15px;fill:#A9A6C9}
      .lit{fill:none;stroke:url(#edge);stroke-width:1.5;opacity:0;animation:lit 12s ease-in-out infinite}
      .halo{fill:#6E6BF2;opacity:0;filter:url(#soft);animation:halo 12s ease-in-out infinite}
      @keyframes lit{0%,100%{opacity:0}3%,14%{opacity:1}20%{opacity:0}}
      @keyframes halo{0%,100%{opacity:0}3%,14%{opacity:.18}20%{opacity:0}}
      .s2{animation-delay:2s}.s3{animation-delay:4s}.s4{animation-delay:6s}.s5{animation-delay:8s}.s6{animation-delay:10s}
      .flow{fill:none;stroke:url(#edge);stroke-width:2;stroke-dasharray:3 7;stroke-linecap:round;animation:flow 1.2s linear infinite;opacity:.8}
      @keyframes flow{to{stroke-dashoffset:-20}}
      .bar{fill:url(#accent);transform-box:fill-box;transform-origin:center;animation:bar 1.1s ease-in-out infinite}
      @keyframes bar{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
      .chip{fill:#FFB8CF;animation:chip 2.4s ease-in-out infinite}
      @keyframes chip{0%,100%{opacity:.35}50%{opacity:1}}
      .ray{stroke:#B9A7FF;stroke-width:1.2;opacity:.15;animation:ray 2.4s linear infinite}
      @keyframes ray{0%,100%{opacity:.12}10%{opacity:1}30%{opacity:.12}}
      .pairdot{transform-box:fill-box;transform-origin:center;animation:pair 3s ease-in-out infinite}
      .pa{animation-name:pairA}.pb{animation-name:pairB}
      @keyframes pairA{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
      @keyframes pairB{0%,100%{transform:translateX(0)}50%{transform:translateX(-7px)}}
      .link{stroke:#B9A7FF;stroke-width:2;stroke-dasharray:24;animation:link 3s ease-in-out infinite}
      @keyframes link{0%,100%{stroke-dashoffset:24}50%{stroke-dashoffset:0}}
      .star{fill:url(#accent);transform-box:fill-box;transform-origin:center;animation:star 2.6s ease-in-out infinite}
      @keyframes star{0%,100%{transform:scale(.7) rotate(0deg);opacity:.6}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
      .arrow{fill:url(#accent);transform-box:fill-box;transform-origin:50% 60%;animation:point 3.2s ease-in-out infinite}
      @keyframes point{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(14deg)}}
      .dist{font-size:12px;fill:#F4F0FF}
      .comet{animation:comet 12s linear infinite}
      @keyframes comet{0%{transform:translate(0,0)}41.4%{transform:translate(630px,0)}58.6%{transform:translate(630px,260px)}100%{transform:translate(0,260px)}}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
  </defs>

  <rect width="1000" height="600" rx="24" fill="#07070D"/>
  <rect width="1000" height="600" rx="24" fill="url(#glowA)"/>
  <rect width="1000" height="600" rx="24" fill="url(#glowB)"/>
  <rect x=".5" y=".5" width="999" height="599" rx="23.5" fill="none" stroke="#1E1E30"/>

  <text x="50" y="50" class="sans eyebrow">HOW A MATCH HAPPENS</text>
  <text x="950" y="50" text-anchor="end" class="sans note">six steps, one introduction</text>

  <!-- the path a match travels, seen between the cards -->
  <path d="M320 185 H365 M635 185 H680 M815 290 V340 M680 445 H635 M365 445 H320" class="flow"/>
  <circle cx="185" cy="185" r="9" fill="url(#comet)" class="comet"/>

  <!-- 01 talk to Emma -->
  <rect x="44" y="74" width="282" height="222" rx="20" class="halo"/>
  <rect x="50" y="80" width="270" height="210" rx="18" class="card"/>
  <rect x="50" y="80" width="270" height="210" rx="18" class="lit"/>
  <text x="74" y="118" class="mono num">01</text>
  <g transform="translate(234 98)">
    <rect x="0" y="0" width="5" height="26" rx="2.5" class="bar"/>
    <rect x="10" y="0" width="5" height="26" rx="2.5" class="bar" style="animation-delay:-.2s"/>
    <rect x="20" y="0" width="5" height="26" rx="2.5" class="bar" style="animation-delay:-.5s"/>
    <rect x="30" y="0" width="5" height="26" rx="2.5" class="bar" style="animation-delay:-.3s"/>
    <rect x="40" y="0" width="5" height="26" rx="2.5" class="bar" style="animation-delay:-.7s"/>
    <rect x="50" y="0" width="5" height="26" rx="2.5" class="bar" style="animation-delay:-.1s"/>
  </g>
  <text x="74" y="170" class="serif ttl">Talk to Emma</text>
  <text class="sans txt"><tspan x="74" y="202">About a minute, by voice: what</tspan><tspan x="74" y="224">you build, what you need, what</tspan><tspan x="74" y="246">you can give, where you are.</tspan></text>

  <!-- 02 your card -->
  <rect x="359" y="74" width="282" height="222" rx="20" class="halo s2"/>
  <rect x="365" y="80" width="270" height="210" rx="18" class="card"/>
  <rect x="365" y="80" width="270" height="210" rx="18" class="lit s2"/>
  <text x="389" y="118" class="mono num">02</text>
  <g transform="translate(553 96)">
    <rect x="0" y="0" width="58" height="40" rx="7" fill="none" stroke="#3A3A5C"/>
    <rect x="8" y="9" width="30" height="4" rx="2" fill="#4A4A70"/>
    <rect x="8" y="18" width="40" height="4" rx="2" fill="#4A4A70"/>
    <rect x="8" y="27" width="22" height="6" rx="3" class="chip"/>
  </g>
  <text x="389" y="170" class="serif ttl">Your card</text>
  <text class="sans txt"><tspan x="389" y="202">Emma writes your profile and</tspan><tspan x="389" y="224">keeps the odd, human details</tspan><tspan x="389" y="246">a stranger would ask about.</tspan></text>

  <!-- 03 agents talk -->
  <rect x="674" y="74" width="282" height="222" rx="20" class="halo s3"/>
  <rect x="680" y="80" width="270" height="210" rx="18" class="card"/>
  <rect x="680" y="80" width="270" height="210" rx="18" class="lit s3"/>
  <text x="704" y="118" class="mono num">03</text>
  <g transform="translate(896 116)">
    <line x1="0" y1="0" x2="22" y2="0" class="ray"/>
    <line x1="0" y1="0" x2="15.6" y2="15.6" class="ray" style="animation-delay:.3s"/>
    <line x1="0" y1="0" x2="0" y2="22" class="ray" style="animation-delay:.6s"/>
    <line x1="0" y1="0" x2="-15.6" y2="15.6" class="ray" style="animation-delay:.9s"/>
    <line x1="0" y1="0" x2="-22" y2="0" class="ray" style="animation-delay:1.2s"/>
    <line x1="0" y1="0" x2="-15.6" y2="-15.6" class="ray" style="animation-delay:1.5s"/>
    <line x1="0" y1="0" x2="0" y2="-22" class="ray" style="animation-delay:1.8s"/>
    <line x1="0" y1="0" x2="15.6" y2="-15.6" class="ray" style="animation-delay:2.1s"/>
    <circle cx="22" cy="0" r="3" fill="#8FD3FF"/><circle cx="15.6" cy="15.6" r="3" fill="#B9A7FF"/>
    <circle cx="0" cy="22" r="3" fill="#FFB8CF"/><circle cx="-15.6" cy="15.6" r="3" fill="#8FD3FF"/>
    <circle cx="-22" cy="0" r="3" fill="#B9A7FF"/><circle cx="-15.6" cy="-15.6" r="3" fill="#FFB8CF"/>
    <circle cx="0" cy="-22" r="3" fill="#8FD3FF"/><circle cx="15.6" cy="-15.6" r="3" fill="#B9A7FF"/>
    <circle r="5.5" fill="#F4F0FF"/>
  </g>
  <text x="704" y="170" class="serif ttl">Agents talk</text>
  <text class="sans txt"><tspan x="704" y="202">Your agent asks up to eight</tspan><tspan x="704" y="224">others: should our people</tspan><tspan x="704" y="246">meet? Each gives a verdict.</tspan></text>

  <!-- 04 the pair -->
  <rect x="674" y="334" width="282" height="222" rx="20" class="halo s4"/>
  <rect x="680" y="340" width="270" height="210" rx="18" class="card"/>
  <rect x="680" y="340" width="270" height="210" rx="18" class="lit s4"/>
  <text x="704" y="378" class="mono num">04</text>
  <g transform="translate(866 374)">
    <line x1="12" y1="0" x2="48" y2="0" class="link"/>
    <circle cx="8" cy="0" r="9" fill="#8FD3FF" class="pairdot pa"/>
    <circle cx="52" cy="0" r="9" fill="#FFB8CF" class="pairdot pb"/>
  </g>
  <text x="704" y="430" class="serif ttl">The pair</text>
  <text class="sans txt"><tspan x="704" y="462">Code decides, not the model:</tspan><tspan x="704" y="484">80% the agents' verdict, 20%</tspan><tspan x="704" y="506">the cards, then fair turns.</tspan></text>

  <!-- 05 the spark -->
  <rect x="359" y="334" width="282" height="222" rx="20" class="halo s5"/>
  <rect x="365" y="340" width="270" height="210" rx="18" class="card"/>
  <rect x="365" y="340" width="270" height="210" rx="18" class="lit s5"/>
  <text x="389" y="378" class="mono num">05</text>
  <g transform="translate(578 374)"><path d="M0 -18 C2 -5 5 -2 18 0 C5 2 2 5 0 18 C-2 5 -5 2 -18 0 C-5 -2 -2 -5 0 -18Z" class="star"/></g>
  <text x="389" y="430" class="serif ttl">The spark</text>
  <text class="sans txt"><tspan x="389" y="462">Half the story each: a name</tspan><tspan x="389" y="484">and one thing to ask. Plus a</tspan><tspan x="389" y="506">2-minute mission, 3 questions.</tspan></text>

  <!-- 06 find each other -->
  <rect x="44" y="334" width="282" height="222" rx="20" class="halo s6"/>
  <rect x="50" y="340" width="270" height="210" rx="18" class="card"/>
  <rect x="50" y="340" width="270" height="210" rx="18" class="lit s6"/>
  <text x="74" y="378" class="mono num">06</text>
  <g transform="translate(222 356)">
    <path d="M14 0 L28 34 L14 26 L0 34 Z" class="arrow"/>
    <text x="40" y="26" class="mono dist">12 m</text>
  </g>
  <text x="74" y="430" class="serif ttl">Find each other</text>
  <text class="sans txt"><tspan x="74" y="462">Both say yes, and an arrow</tspan><tspan x="74" y="484">and a distance lead the way.</tspan><tspan x="74" y="506">UWB on iPhone, GPS on web.</tspan></text>
</svg>
