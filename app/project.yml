name: Roomie
options:
  bundleIdPrefix: com.jtobin
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ZZYK46YQNL
    CODE_SIGN_STYLE: Automatic
targets:
  Roomie:
    type: application
    platform: iOS
    sources: [Roomie]
    info:
      path: Roomie/Info.plist
      properties:
        CFBundleDisplayName: PairShake
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Emma listens while you answer her questions.
        NSSpeechRecognitionUsageDescription: Your answers become text so Emma can find your person.
        NSLocalNetworkUsageDescription: PairShake talks to the PairShake server on this network.
        NSBluetoothAlwaysUsageDescription: Finds your person's phone nearby, even when the Wi-Fi is bad.
        NSNearbyInteractionUsageDescription: Points you toward your person when you both agree to meet.
        NSCameraUsageDescription: Helps point you toward your person more precisely.
        NSMotionUsageDescription: Counts your steps toward your person.
        NSLocationWhenInUseUsageDescription: Shows you and your person which way to walk when Ultra Wideband can't reach.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    postCompileScripts:
      - name: Bundle the hands' models and three.js
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="$PROJECT_DIR/web/hands"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web"
          mkdir -p "$DST/hands" "$DST/vendor"
          rsync -a --delete "$PROJECT_DIR/Vendor/" "$DST/vendor/"
          # each model with its ETag (mtime in nanoseconds and size, in hex: the same edge/deploy.sh gives Cloudflare),
          # so the app can tell when Cloudflare's copy changed
          etag() { t=$(stat -f %Fm "$1"); s=${t%.*}; f=$(printf '%-9s' "${t#*.}" | tr ' ' 0); printf '"\\"%x-%x\\""' $((s * 1000000000 + 10#$f)) "$(stat -f %z "$1")"; }
          sep=""; printf '{\n' > "$DST/manifest.json"
          for f in hand_r.glb hand_l.glb hand_r_lo.glb handkit_wasm_bg.wasm ring.bin; do
            [ -f "$SRC/$f" ] || continue
            cp "$SRC/$f" "$DST/hands/$f"
            printf '%s "/hands/%s": %s' "$sep" "$f" "$(etag "$SRC/$f")" >> "$DST/manifest.json"; sep=", "
          done
          printf '\n}\n' >> "$DST/manifest.json"
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.jtobin.roomie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon      # Roomie/AppIcon.icon (Icon Composer; art from tools/icon_art.py)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
